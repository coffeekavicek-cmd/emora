name: EMORA Backend · Edge QA
on:
  push:
    branches: [emora-reborn-v1]
    paths:
      - supabase/functions/**
      - supabase/migrations/**
      - .github/workflows/supabase-edge-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  edge-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check production Edge Functions
        run: |
          deno check --node-modules-dir=auto supabase/functions/checkout-create/index.ts
          deno check --node-modules-dir=auto supabase/functions/payme-merchant/index.ts
          deno check --node-modules-dir=auto supabase/functions/click-shop/index.ts
          deno check --node-modules-dir=auto supabase/functions/publish-site/index.ts
      - name: Reject hardcoded merchant credentials
        run: |
          ! grep -R -E "(CLICK_SECRET_KEY|PAYME_KEY|SUPABASE_SERVICE_ROLE_KEY)[[:space:]]*=[[:space:]]*['\"][^'\"]+['\"]" supabase/functions
      - name: Verify required migration guards exist
        run: |
          grep -R -q "orders_one_active_checkout_per_site_uq" supabase/migrations
          grep -R -q "trg_revoke_site_after_last_refund" supabase/migrations
          grep -R -q "status = 'draft'" supabase/migrations/20260930_lock_published_sites_and_media.sql
