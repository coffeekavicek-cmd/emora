name: EMORA — 5 flagship experiences QA
on:
  push:
    branches: [emora-v10-fifteen-experiences, emora-v18-studio-preview-layout-fix, emora-v19-birthday-ritual, emora-v20-birthday-studio-integration, emora-v21-qa-preview-release, emora-v22-checkout-media-safety, emora-v23-mobile-hero-fix, emora-v24-five-rituals-apology, emora-v25-apology-corrected-meeting-bot, emora-v26-love-confession-cinema]
    paths:
      - .github/workflows/flagship-five-qa.yml
      - supabase/functions/emora-checkout/**
      - supabase/functions/emora-click/**
      - supabase/functions/emora-payme/**
      - supabase/migrations/20261005_emora_v17_admin_analytics_hardening.sql
      - v5-live/index.html
      - v5-live/server.mjs
      - v5-live/templates/v10-proposal-editor.js
      - v5-live/templates/v15-product-system.js
      - v5-live/templates/v15-runtime-fixes.js
      - v5-live/templates/v15-product-system.css
      - v5-live/templates/v16-payment.js
      - v5-live/templates/v16-payment.css
      - v5-live/templates/v17-admin.js
      - v5-live/templates/v17-admin.css
      - v5-live/templates/v18-studio-rebuild.js
      - v5-live/templates/v18-studio-rebuild.css
      - v5-live/templates/v18-flagship-polish.js
      - v5-live/templates/v18-flagship-polish.css
      - v5-live/templates/v19-birthday-cake.html
      - v5-live/templates/v24-apology-secret.html
      - v5-live/templates/v26-love-confession.html
      - v5-live/templates/v26-love-heart.js
      - v5-live/meeting-bot.mjs
      - v5-live/tests/v25-meeting-bot-qa.mjs
      - v5-live/templates/v23-heart-reveal.js
      - v5-live/templates/v23-heart-reveal.css
      - v5-live/templates/v23-mobile-layout.css
      - v5-live/templates/v12-flagship-polish.css
      - v5-live/templates/v12-silk-media.js
      - v5-live/templates/v10-rose-theatre.**
      - v5-live/templates/v10-love-rose.html
      - v5-live/templates/v10-aurora-paper.**
      - v5-live/templates/v10-birthday-aurora.html
      - v5-live/templates/v10-quiet-room.**
      - v5-live/templates/v10-apology-quiet.html
      - v5-live/templates/v10-pearl-promise.**
      - v5-live/templates/v10-proposal-pearl.html
      - v5-live/templates/silk-heritage.**
      - v5-live/templates/silk-motion.css
      - v5-live/templates/silk-stage.css
      - v5-live/templates/wedding-silk.html
      - v5-live/templates/v10-core.css
      - v5-live/templates/v10-motion.css
      - v5-live/templates/v11-stage.css
      - v5-live/tests/v15-product-system-qa.mjs
      - v5-live/tests/v16-payment-ui-qa.mjs
      - v5-live/tests/v16-payment-backend-static-qa.mjs
      - v5-live/tests/v17-admin-qa.mjs
      - v5-live/tests/v18-studio-ritual-qa.mjs
      - v5-live/tests/v19-birthday-ritual-qa.mjs
      - v5-live/tests/v20-birthday-studio-qa.mjs
      - v5-live/tests/v22-checkout-save-qa.mjs
      - v5-live/tests/v22-birthday-media-slots-qa.mjs
      - v5-live/tests/v23-heart-reveal-qa.mjs
      - v5-live/tests/v23-mobile-layout-qa.mjs
      - v5-live/tests/v24-apology-qa.mjs
      - v5-live/tests/v26-love-qa.mjs
      - v5-live/tests/v15-product-system-qa.mjs
      - v5-live/tests/v26-love-studio-qa.mjs
      - v5-live/tests/v24-apology-studio-qa.mjs
      - v5-live/tests/v12-silk-media-qa.mjs
      - v5-live/tests/v10-five-flagship-editor-qa.mjs
      - v5-live/tests/v10-rose-theatre-qa.mjs
      - v5-live/tests/v10-aurora-paper-qa.mjs
      - v5-live/tests/v10-quiet-room-qa.mjs
      - v5-live/tests/v10-pearl-promise-qa.mjs
      - v5-live/tests/silk-visual-qa.mjs
  workflow_dispatch:
concurrency:
  group: emora-five-flagships
  cancel-in-progress: true
jobs:
  flagship-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and Playwright
        run: |
          npm install --prefix v5-live --no-save playwright@1.55.0
          cd v5-live && npx playwright install --with-deps chromium
      - name: Start validated EMORA server
        run: |
          PORT=3000 node v5-live/server.mjs > /tmp/emora-five.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 1
          done
          cat /tmp/emora-five.log
          curl --fail --silent --show-error http://127.0.0.1:3000/health
      - name: Owner — V17 analytics dashboard
        run: node v5-live/tests/v17-admin-qa.mjs
      - name: V22 — Last saved owner draft required before checkout
        run: node v5-live/tests/v22-checkout-save-qa.mjs
      - name: V22 — Sparse photo and caption alignment
        run: node v5-live/tests/v22-birthday-media-slots-qa.mjs
      - name: V23 — iPhone mobile hero one-column
        run: node v5-live/tests/v23-mobile-layout-qa.mjs
      - name: V23 — names-to-heart-to-photo ritual, 3 languages
        run: node v5-live/tests/v23-heart-reveal-qa.mjs
      - name: Birthday — V20 Studio to recipient live data
        run: node v5-live/tests/v20-birthday-studio-qa.mjs
      - name: Product — unified competitor-informed V15 funnel
        run: node v5-live/tests/v15-product-system-qa.mjs
      - name: Product — gated Click/Payme V16 checkout
        run: node v5-live/tests/v16-payment-ui-qa.mjs
      - name: Payments — backend callback security contract
        run: node v5-live/tests/v16-payment-backend-static-qa.mjs
      - name: Product — V18 reported preview + ritual regression
        run: node v5-live/tests/v18-studio-ritual-qa.mjs
      - name: Creator Studio — flagship field adapters
        run: node v5-live/tests/v10-five-flagship-editor-qa.mjs
      - name: Love — Rose Theatre
        run: node v5-live/tests/v10-rose-theatre-qa.mjs
      - name: Birthday — Aurora Paper
        run: node v5-live/tests/v10-aurora-paper-qa.mjs
      - name: Birthday — V19 date, candles, portraits, private film and envelope
        run: node v5-live/tests/v19-birthday-ritual-qa.mjs
      - name: V25 — Bot delivery contract, sender authorization and replay
        run: node v5-live/tests/v25-meeting-bot-qa.mjs
      - name: V26 — original love confession journey and name-heart (UZ/RU/EN)
        run: node v5-live/tests/v26-love-qa.mjs
      - name: V26 — creator Studio and personal confession content
        run: node v5-live/tests/v26-love-studio-qa.mjs
      - name: V24 — cinematic apology owner script (UZ/RU/EN)
        run: node v5-live/tests/v24-apology-qa.mjs
      - name: V24 — Creator apology language preview
        run: node v5-live/tests/v24-apology-studio-qa.mjs
      - name: Apology — Quiet Room
        run: node v5-live/tests/v10-quiet-room-qa.mjs
      - name: Proposal — Pearl Promise
        run: node v5-live/tests/v10-pearl-promise-qa.mjs
      - name: Wedding — Silk Heritage
        run: node v5-live/tests/silk-visual-qa.mjs
      - name: Wedding — personal film
        run: node v5-live/tests/v12-silk-media-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emora-five-flagships-qa
          path: |
            v5-live/qa-v10-results/
            v5-live/qa-silk-artifacts/
          retention-days: 7
