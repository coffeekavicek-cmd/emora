name: EMORA Reborn · 5 Flagship QA
on:
  push:
    branches: [emora-reborn-v1]
    paths:
      - experience-engine/**
      - .github/workflows/experience-engine-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flagship-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact engine dependencies
        working-directory: experience-engine
        run: npm install --no-audit --no-fund
      - name: Validate experience system
        working-directory: experience-engine
        run: npm run validate:system
      - name: Production build
        working-directory: experience-engine
        run: npm run build
      - name: Verify production bundle
        working-directory: experience-engine
        run: |
          test -f dist/index.html
          grep -q "assets/" dist/index.html
          test "$(find dist/assets -type f | wc -l)" -ge 2
      - name: Install Chromium for flagship browser QA
        working-directory: experience-engine
        run: npx playwright install --with-deps chromium
      - name: Five flagship mobile interaction QA
        working-directory: experience-engine
        run: npx playwright test tests/pearl-reference.spec.js tests/silk-heritage.spec.js tests/balloon-dream.spec.js tests/after-rain.spec.js tests/proposal-pearl.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emora-five-flagship-qa
          path: |
            experience-engine/dist/
            experience-engine/playwright-report/
            experience-engine/test-results/
          retention-days: 7
