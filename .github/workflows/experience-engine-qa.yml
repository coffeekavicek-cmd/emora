name: EMORA Experience Engine · 15 Ritual QA
on:
  push:
    branches: [emora-experience-engine-galaxy-v1, emora-experience-engine-all-15-v1, emora-pearl-linen-flagship-v1, emora-cinematic-scenarios-v3, emora-pearl-storyboard-motion-v1, emora-ideal-system-v1, emora-reference-pearl-v1, emora-pearl-deep-ritual-v2, emora-pearl-masterpiece-v3, emora-reborn-v1]
    paths:
      - experience-engine/**
      - .github/workflows/experience-engine-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact engine dependencies
        working-directory: experience-engine
        run: npm install --no-audit --no-fund
      - name: Validate experience system
        working-directory: experience-engine
        run: npm run validate:system
      - name: Production build
        working-directory: experience-engine
        run: npm run build
      - name: Verify production bundle
        working-directory: experience-engine
        run: |
          test -f dist/index.html
          grep -q "assets/" dist/index.html
          test "$(find dist/assets -type f | wc -l)" -ge 2
      - name: Install Chromium for browser QA
        working-directory: experience-engine
        run: npx playwright install --with-deps chromium
      - name: Mobile browser interaction QA
        working-directory: experience-engine
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emora-experience-engine-qa
          path: |
            experience-engine/dist/
            experience-engine/playwright-report/
            experience-engine/test-results/
          retention-days: 7
