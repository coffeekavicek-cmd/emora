name: EMORA — 15 template single-screen QA
on:
  push:
    branches: [emora-v10-fifteen-experiences]
    paths:
      - .github/workflows/v10-qa.yml
      - v5-live/tests/v10-qa.mjs
      - v5-live/tests/v10-platform-qa.mjs
      - v5-live/tests/v10-media.test.mjs
      - v5-live/tests/v10-pearl-promise-qa.mjs
      - v5-live/tests/v10-cinema-proposal-qa.mjs
      - v5-live/tests/v10-sky-promise-qa.mjs
      - v5-live/templates/v10-**
      - v5-live/templates/v11-stage.css
      - v5-live/templates/silk-heritage.**
      - v5-live/templates/silk-motion.css
      - v5-live/templates/silk-stage.css
      - v5-live/templates/wedding-silk.html
      - v5-live/index.html
      - v5-live/server.mjs
      - Dockerfile
  workflow_dispatch:
concurrency:
  group: emora-v10-browser-qa
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chrome and Playwright
        run: |
          npm install --prefix v5-live --no-save playwright@1.55.0
          cd v5-live && npx playwright install --with-deps chromium
      - name: Run startup validation and local website
        run: |
          PORT=3000 node v5-live/server.mjs > /tmp/emora-v10-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 1
          done
          cat /tmp/emora-v10-server.log
          curl --fail --silent --show-error http://127.0.0.1:3000/health
          curl --fail --silent --show-error --head http://127.0.0.1:3000/assets/love-galaxy.png
      - name: Test owner-private draft and published media lifecycle
        run: node --test v5-live/tests/v10-media.test.mjs
      - name: Test all 15 templates on desktop and mobile
        run: node v5-live/tests/v10-qa.mjs
      - name: Test Pearl Promise flagship ritual end-to-end
        run: node v5-live/tests/v10-pearl-promise-qa.mjs
      - name: Test Cinema Proposal flagship ritual end-to-end
        run: node v5-live/tests/v10-cinema-proposal-qa.mjs
      - name: Test Sky Promise flagship ritual end-to-end
        run: node v5-live/tests/v10-sky-promise-qa.mjs
      - name: Test category-first discovery and the live creator editor
        run: node v5-live/tests/v10-platform-qa.mjs
      - name: Preserve review evidence
        if: always()
        run: |
          mkdir -p v5-live/tests/v10-qa-results
          if [ -f v5-live/qa-v10-results/summary.json ]; then cp v5-live/qa-v10-results/summary.json v5-live/tests/v10-qa-results/summary.json; fi
          for summary in pearl-promise-summary.json cinema-proposal-summary.json sky-promise-summary.json platform-summary.json; do
            if [ -f "v5-live/qa-v10-results/$summary" ]; then cp "v5-live/qa-v10-results/$summary" v5-live/tests/v10-qa-results/; fi
          done
          if [ -f v5-live/qa-v10-results/platform-home.png ]; then cp v5-live/qa-v10-results/platform-home.png v5-live/tests/v10-qa-results/; fi
          for name in love-rose wedding-silk birthday-aurora apology-rain proposal-pearl; do
            if [ -f "v5-live/qa-v10-results/mobile-$name-intro.png" ]; then cp "v5-live/qa-v10-results/mobile-$name-intro.png" v5-live/tests/v10-qa-results/; fi
          done
          for name in pearl-mobile-intro.png pearl-mobile-reasons.png pearl-mobile-proposal.png pearl-small-intro.png pearl-small-reasons.png pearl-small-proposal.png pearl-desktop-intro.png pearl-desktop-reasons.png pearl-desktop-proposal.png cinema-mobile-intro.png cinema-mobile-trailer.png cinema-mobile-frames.png cinema-mobile-proposal.png cinema-small-intro.png cinema-small-trailer.png cinema-small-frames.png cinema-small-proposal.png cinema-desktop-intro.png cinema-desktop-trailer.png cinema-desktop-frames.png cinema-desktop-proposal.png sky-mobile-intro.png sky-mobile-dreams.png sky-mobile-proposal.png sky-small-intro.png sky-small-dreams.png sky-small-proposal.png sky-desktop-intro.png sky-desktop-dreams.png sky-desktop-proposal.png; do
            if [ -f "v5-live/qa-v10-results/$name" ]; then cp "v5-live/qa-v10-results/$name" v5-live/tests/v10-qa-results/; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v5-live/tests/v10-qa-results/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Visual QA evidence for 15 EMORA cinematic templates"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emora-v10-all-15-visual-qa
          path: v5-live/qa-v10-results/
          retention-days: 7
