name: Silk Heritage visual QA
on:
  push:
    branches: [emora-v9-cinematic-templates]
    paths:
      - .github/workflows/qa-silk.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: emora-v9-cinematic-templates
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and headless Chromium
        run: |
          npm install --prefix v5-live --no-save playwright@1.55.0
          cd v5-live && npx playwright install --with-deps chromium
      - name: Run EMORA standalone server
        run: |
          PORT=3000 node v5-live/server.mjs > /tmp/emora-silk-server.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 1
          done
          cat /tmp/emora-silk-server.log
          curl --fail --silent --show-error --head http://127.0.0.1:3000/assets/silk-heritage-original.jpg
      - name: Capture desktop and mobile + test interactions
        run: node v5-live/tests/silk-visual-qa.mjs
      - name: Preserve review screenshots in V9 QA evidence
        if: always()
        run: |
          mkdir -p v5-live/tests/visual-qa-results
          for file in desktop-opening.png mobile-opening.png summary.json; do
            if [ -f "v5-live/qa-silk-artifacts/$file" ]; then
              cp "v5-live/qa-silk-artifacts/$file" v5-live/tests/visual-qa-results/
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v5-live/tests/visual-qa-results/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "QA evidence: desktop and mobile Silk opening screenshots"
          git pull --rebase origin emora-v9-cinematic-templates
          git push origin HEAD:emora-v9-cinematic-templates
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emora-silk-visual-qa
          path: v5-live/qa-silk-artifacts/
          retention-days: 7
