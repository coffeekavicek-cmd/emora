name: EMORA Reborn · Pearl Fast QA
on:
  push:
    branches: [emora-reborn-v1]
    paths:
      - experience-engine/src/reborn/**
      - experience-engine/src/main.jsx
      - experience-engine/src/system/CreatorEditor.jsx
      - experience-engine/tests/pearl-reference.spec.js
      - .github/workflows/reborn-pearl-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pearl:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: experience-engine
        run: npm install --no-audit --no-fund
      - name: Validate and build
        working-directory: experience-engine
        run: npm run validate:system && npm run build
      - name: Install Chromium
        working-directory: experience-engine
        run: npx playwright install --with-deps chromium
      - name: Reborn Pearl mobile QA
        working-directory: experience-engine
        run: npx playwright test tests/pearl-reference.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emora-reborn-pearl-qa
          path: |
            experience-engine/test-results/
            experience-engine/playwright-report/
          retention-days: 7
