name: Archive original Silk Heritage hero
on:
  push:
    branches: [emora-v9-cinematic-templates]
    paths:
      - .github/workflows/archive-silk-hero.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: emora-v9-cinematic-templates
      - name: Download and verify original Runway art
        env:
          ASSET_URL: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/a94224e7-a8ea-4a7a-95fb-b6b1de768196/7e51ebe4-e2ba-43ad-a3bb-1dcd14b04932/One_immaculate_cinematic_3D_render_of_a_luxurious_cream_hand.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDYwYTQ2ZmZmOTU2MDlmMiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDU5NDU1OX0.5zoHw8aXhFnQZFLZpJi2Q3iSa75rEyE2qcIQVQW22YI'
        run: |
          mkdir -p v5-live/assets
          curl --fail --location --silent --show-error --retry 2 --max-time 90 "$ASSET_URL" -o v5-live/assets/silk-heritage-original.jpg
          file --mime-type v5-live/assets/silk-heritage-original.jpg | grep -E 'image/(jpeg|png|webp)'
          test "$(wc -c < v5-live/assets/silk-heritage-original.jpg)" -gt 30000
      - name: Commit original visual to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v5-live/assets/silk-heritage-original.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive original Silk Heritage cinematic hero locally"
          git pull --rebase origin emora-v9-cinematic-templates
          git push origin HEAD:emora-v9-cinematic-templates
