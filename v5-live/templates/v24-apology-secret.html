const $=sel=>document.querySelector(sel), $$=sel=>Array.from(document.querySelectorAll(sel));
const stages=['secret','question','letter','meeting'];
let lang=new URLSearchParams(location.search).get('lang')||'uz';if(!I[lang])lang='uz';
const state={siteSlug:'',recipient:'Jasmina',sender:'',clue:'',clueRu:'',clueEn:'',mistake:'',repair:'',letter:'',letterRu:'',letterEn:'',photos:[],video:'',music:'',choice:'',teases:0,opened:false};
const audio=new Audio();audio.loop=true;audio.preload='none';
function t(){return I[lang]}
function safeUrl(s){if(typeof s!=='string'||!s.trim())return '';try{const u=new URL(s,location.origin);return ['https:','http:'].includes(u.protocol)&&!u.username&&!u.password?u.href:''}catch{return ''}}
function normalize(s){return String(s||'').normalize('NFKC').trim().replace(/\s+/g,' ').toLocaleLowerCase().replace(/ё/g,'е')}
function move(stage){for(const id of stages){const node=$('#'+id),on=id===stage;node.classList.toggle('active',on);node.inert=!on;node.setAttribute('aria-hidden',String(!on))}$('#progressBar').style.width=((stages.indexOf(stage)+1)/stages.length*100)+'%';$('#'+stage).querySelector('h1,h2')?.focus?.({preventScroll:true})}
function translate(){document.documentElement.lang=lang;$$('[data-i18n]').forEach(e=>{const v=t()[e.dataset.i18n];if(v!==undefined)e.textContent=v});$$('[data-lang]').forEach(e=>e.setAttribute('aria-pressed',String(e.dataset.lang===lang)));$('#secretError').textContent='';$('#letterGreeting').textContent=t().greeting+(state.recipient||'♡');$('#letterSignature').textContent=state.sender||t().sign;const authored=lang==='ru'?(state.letterRu||t().letterDefault):lang==='en'?(state.letterEn||t().letterDefault):(state.letter||t().letterDefault);$('#letterBody').textContent=[t().letterJoke,lang==='uz'?state.mistake:'',authored,lang==='uz'?state.repair:''].filter(Boolean).join('\n\n');const hint=lang==='ru'?state.clueRu:lang==='en'?state.clueEn:state.clue;$('#secret .sub').textContent=hint||t().secretHint;$('#musicBtn').textContent=t()[$('#musicBtn').getAttribute('aria-pressed')==='true'?'musicOn':'musicOff'];const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());$('#meetDate').min=d.toISOString().slice(0,10);renderRecap()}
function renderAssets(){const imgs=$('#memories');imgs.replaceChildren();for(const s of state.photos.slice(0,3)){const src=safeUrl(s);if(!src)continue;const el=document.createElement('img');el.src=src;el.alt='Personal memory';el.onerror=()=>el.remove();imgs.append(el)}const vid=$('#privateVideo'),url=safeUrl(state.video);if(url){if(vid.src!==url)vid.src=url;vid.hidden=false}else{vid.pause();vid.removeAttribute('src');vid.load();vid.hidden=true}const music=safeUrl(state.music);if(music){if(audio.src!==music){audio.pause();audio.src=music;$('#musicBtn').setAttribute('aria-pressed','false')}$('#musicBtn').hidden=false}else{audio.pause();audio.removeAttribute('src');$('#musicBtn').hidden=true}}
function ingest(input){if(!input||typeof input!=='object')return;const c=input.config&&typeof input.config==='object'?input.config:input;state.siteSlug=typeof c.pageSlug==='string'&&/^[a-z0-9-]{1,60}$/.test(c.pageSlug)?c.pageSlug:'';state.recipient=String(c.recipient||c.name1||state.recipient).slice(0,80);state.sender=String(c.sender||c.name2||state.sender).slice(0,80);state.clue=String(c.secretHint||state.clue).slice(0,160);state.clueRu=String(c.secretHintRu||c.headlineRu||state.clueRu).slice(0,160);state.clueEn=String(c.secretHintEn||c.headlineEn||state.clueEn).slice(0,160);state.mistake=String(c.mistake||state.mistake).slice(0,450);state.repair=String(c.repair||state.repair).slice(0,450);state.letter=typeof c.letter==='string'?c.letter.slice(0,4000):state.letter;state.letterRu=typeof c.letterRu==='string'?c.letterRu.slice(0,4000):state.letterRu;state.letterEn=typeof c.letterEn==='string'?c.letterEn.slice(0,4000):state.letterEn;state.photos=Array.isArray(c.photos)?c.photos.slice(0,3):state.photos;state.video=typeof c.video==='string'?c.video:state.video;state.music=typeof c.music==='string'?c.music:state.music;translate();renderAssets()}
$('#secretForm').addEventListener('submit',e=>{e.preventDefault();if(normalize($('#secretAnswer').value)!==normalize(state.recipient)){$('#secretError').textContent=t().wrong;return}$('#secretError').textContent='';move('question');if(audio.src)audio.play().then(()=>{$('#musicBtn').setAttribute('aria-pressed','true');translate()}).catch(()=>{})});
function tease(){state.teases++;$('#teasing').textContent=t().tease;const n=$('#yesBtn');const step=state.teases%5;const dx=[68,-58,48,-42,58][step],dy=[-34,35,27,-30,-14][step];n.style.transform='translate('+dx+'px,'+dy+'px)';}
const runaway=$('#yesBtn');runaway.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')tease()});runaway.addEventListener('click',e=>{e.preventDefault();tease()});runaway.addEventListener('touchstart',e=>{e.preventDefault();tease()},{passive:false});runaway.addEventListener('focus',()=>{if(state.teases<1)$('#teasing').textContent=t().tease});

function renderRecap(){
 const items=[[t().recapPlace,state.choice?t()[state.choice]:null],[t().recapDate,$('#meetDate').value||null],[t().recapTime,$('#meetTime').value||null]];
 const target=$('#meetingRecap');target.replaceChildren();
 for(const [label,value] of items){if(!value)continue;const chip=document.createElement('span');chip.className='recap-chip';chip.textContent=label+': '+value;target.append(chip)}
}
for(const id of ['meetDate','meetTime'])$('#'+id).addEventListener('change',renderRecap);
$('#sendMeeting').addEventListener('click',async()=>{
 const day=$('#meetDate').value,time=$('#meetTime').value;
 if(!state.choice||!/^\d{4}-\d{2}-\d{2}$/.test(day)||!/^\d{2}:\d{2}$/.test(time)||day<$('#meetDate').min){
  $('#meetingError').textContent=t().missing;return
 }
 const btn=$('#sendMeeting');btn.disabled=true;btn.textContent=t().sending;
 $('#meetingError').textContent='';$('#meetingResult').hidden=true;
 if(!state.siteSlug){$('#meetingError').textContent=t().botUnavailable;btn.disabled=false;btn.textContent=t().telegram;return}
 try{
  const response=await fetch('/api/apology-meeting',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({slug:state.siteSlug,choice:state.choice,date:day,time})});
  const result=await response.json().catch(()=>null);
  if(!response.ok||result?.ok!==true)throw new Error(result?.error||'delivery');
  $('#meetingResult').hidden=false;
  $('#meetingResult').textContent=t().sent+' \n'+t()[state.choice]+' · '+day+' · '+time;
  btn.textContent=t().sent;
 }catch(err){
  $('#meetingError').textContent=['bot_not_configured','owner_not_connected','delivery_storage_unavailable'].includes(err.message)?t().botUnavailable:t().sendingFailed;
  btn.disabled=false;btn.textContent=t().telegram;
 }
});

$$('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;translate()}));

window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data?.config||!['emora:moment-preview','emora:moment-published','emora:preview'].includes(e.data.type))return;ingest(e.data)});
translate();renderAssets();move('secret');
window.__EMORA_APOLOGY_V24__={version:24,stages:stages.slice(),get active(){return stages.find(id=>$('#'+id).classList.contains('active'))},get recipient(){return state.recipient},get choice(){return state.choice},get teases(){return state.teases},get lang(){return lang},ingest};
})();
