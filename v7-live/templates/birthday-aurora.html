const safeMedia=(x,kind='photo')=>{const s=String(x??''); if(/^blob:https?:\/\//.test(s))return s;
  if(/^\/media\/[a-f0-9]{24}\.(jpg|png|webp|mp4|webm|mp3|m4a|ogg)$/.test(s))return s;
  if(kind==='photo'&&(s.startsWith('data:image/svg+xml;base64,')||s.startsWith('https://commons.wikimedia.org/wiki/Special:FilePath/')))return s;
  return '';
};
const sceneMap={birthday:['intro','memory','film','gift','final'],apology:['intro','reflection','memory','letter','response','final'],proposal:['intro','memory','film','letter','ring','final']};
let config=previewConfig(chosen),template=MOMENTS[chosen],stage='intro',lock=false,playing=false,letterOpen=false,giftOpen=false,ringOpen=false,answer='',returnStage='intro',responseSending=false;
let lastIntro=false,volumeBeforeFilm=.58;const reduce=window.matchMedia('(prefers-reduced-motion: reduce)');
const bgMusic=document.createElement('audio');bgMusic.loop=true;bgMusic.preload='none';bgMusic.volume=.58;document.body.append(bgMusic);
function sparkle(n=54){if(reduce.matches)return;const el=document.createElement('div');el.className='sparkles';el.setAttribute('aria-hidden','true');for(let i=0;i<n;i++){const s=document.createElement('i');s.style.setProperty('--x',Math.random()*100+'%');s.style.setProperty('--dx',(Math.random()-.5)*350+'px');s.style.setProperty('--dur',1.7+Math.random()*2+'s');s.style.setProperty('--delay',Math.random()*.3+'s');el.append(s);}document.body.append(el);setTimeout(()=>el.remove(),4700);}
function title(x){return `<h1>${esc(x)}</h1>`;}
function mood(data){let html='';for(const [i,p] of (data.photos||[]).slice(0,3).entries()){const src=safeMedia(p);if(!src)continue;html+=`<figure class="memory-card card-${i+1}" tabindex="0"><img src="${esc(src)}" alt="Xotira ${i+1}" loading="${i?'lazy':'eager'}"><figcaption><span>0${i+1} / 03</span><p>${esc(data.compliments?.[i]||'Birga o‘tgan unutilmas kun.')}</p></figcaption></figure>`;}return html||`<div class="memory-placeholder">✦<span>O‘zingizning uchta unutilmas suratingizni joylang.</span></div>`;}
function film(data){const src=safeMedia(data.video,'video');return src?`<div class="cinema-screen"><video id="momentVideo" src="${esc(src)}" controls playsinline preload="metadata" poster="${esc(safeMedia(data.photos?.[1]))}"></video><span class="film-perf">EMORA / A FILM FOR YOU</span></div><p class="small">Videoni boshlaganingizda fon musiqasi to‘xtaydi.</p>`:`<div class="cinema-empty"><span class="play-glyph">▷</span><h3>Bizning kichik kinomiz.</h3><p>Bu joyga sizning videongiz yuklanadi.</p></div>`;}
function envelope(data){return `<div class="envelope-wrap"><button id="envelope" class="envelope ${letterOpen?'opened':''}" aria-expanded="${letterOpen}" aria-label="Xatni ochish"><span class="env-flap"></span><span class="env-front"></span><span class="env-seal">e.</span><span class="env-address">TO: ${esc((data.recipient||'SEVGILIM').toUpperCase())}</span></button><article id="paper" class="paper ${letterOpen?'revealed':''}" ${letterOpen?'':'hidden'}><div class="paper-edge">EMORA / PERSONAL LETTER · Nº 01</div><p>${esc(data.letter||'Sizga atalgan maktub...').replace(/\n/g,'<br>')}</p><span class="signature">— ${esc(data.sender||'Seni sevuvchi inson')}</span></article></div>`;}
function dateSentence(data){const date=new Date(data.eventAt||data.metAt||Date.now());return new Intl.DateTimeFormat('uz-UZ',{year:'numeric',month:'long',day:'numeric',timeZone:'Asia/Tashkent'}).format(date);}
function renderBirthday(){switch(stage){
  case 'intro':return `<div class="scene-copy intro-copy"><p class="eyebrow">01 / BUGUN SIZ UCHUN</p><span class="galaxy-symbol" aria-hidden="true">✧</span><h1>${esc(config.recipient||'Aziz inson')}, <em>${esc(config.intro||'bugun sizning kuningiz.')}</em></h1><p>Eng chiroyli tilaklar oddiy xabar ichiga sig‘maydi.</p><button class="action fill" data-next>Sehrni boshlash ✨</button></div>`;
  case 'memory':return `<div class="memory-scene"><p class="eyebrow">02 / UCHTA XOTIRA</p><h2>${esc(config.memoryTitle||'Eng go‘zal kadrlar')}</h2><div class="memory-grid">${mood(config)}</div><button class="action outline" data-next>Davom etish ↗</button></div>`;
  case 'film':return `<div class="film-scene"><p class="eyebrow">03 / SIZGA ATALGAN</p><h2>Bu kunning <em>kichkina filmi.</em></h2>${film(config)}<button class="action outline" data-next>Keyingi sovg‘a ↗</button></div>`;
  case 'gift':return `<div class="scene-copy gift-scene"><p class="eyebrow">04 / SIRLI SOVG‘A</p><h2>Baxt uchun <em>bitta tilak.</em></h2><div class="present-stage"><button id="gift" class="gift ${giftOpen?'opened':''}" aria-label="Sovg‘ani ochish" aria-expanded="${giftOpen}"><span class="gift-lid"></span><span class="gift-ribbon"></span><span class="gift-base"></span><span class="gift-glow">✦</span></button></div><p>${giftOpen?esc(config.letter):'Qutiga bosing. Siz uchun kichkina mo‘jiza bor.'}</p><button class="action fill" data-next ${giftOpen?'':'disabled'}>Yakuniy tilak ↗</button></div>`;
  default:return `<div class="scene-copy finale"><span class="galaxy-symbol">✦</span><p class="eyebrow">05 / ENG GO‘ZAL TILAKLAR</p><h1>${esc(config.recipient||'Do‘stim')}, <em>tug‘ilgan kuning bilan!</em></h1><p>${esc(config.final)}</p><span class="written-by">Mehr bilan, ${esc(config.sender)}</span><button class="action outline" id="replay">Qayta ko‘rish ↻</button></div>`;
}}
function renderApology(){switch(stage){
  case 'intro':return `<div class="scene-copy intro-copy"><p class="eyebrow">01 / AYTILMAGAN SO‘Z</p><div class="rain-icon">❦</div><h1>${esc(config.recipient)}, <em>${esc(config.intro)}</em></h1><p>Shoshmasdan o‘qing. Sizning vaqtingiz muhim.</p><button class="action fill" data-next>Maktubni boshlash ↗</button></div>`;
  case 'reflection':return `<div class="scene-copy reflection"><p class="eyebrow">02 / TAN OLISH</p><h2>Men <em>xato qildim.</em></h2><blockquote>${esc(config.mistake)}</blockquote><h3>Va buni o‘zgartirmoqchiman.</h3><p>${esc(config.repair)}</p><button class="action outline" data-next>Davom etish ↗</button></div>`;
  case 'memory':return `<div class="memory-scene"><p class="eyebrow">03 / QADRLI LAHZALAR</p><h2>Esdan chiqmaydigan <em>kunlar.</em></h2><div class="memory-grid">${mood(config)}</div><button class="action outline" data-next>Yurakdan xat ↗</button></div>`;
  case 'letter':return `<div class="letter-scene"><p class="eyebrow">04 / SHAXSIY MAKTUB</p><h2>So‘zlarimni <em>o‘qi.</em></h2>${envelope(config)}<button class="action outline" data-next ${letterOpen?'':'disabled'}>Davom etish ↗</button></div>`;
  case 'response':return `<div class="scene-copy response-scene"><p class="eyebrow">05 / QARORINGIZ MUHIM</p><h2>Gaplashishga <em>tayyormisan?</em></h2><p>Hech qanday majburiyat yo‘q. Istasang, hozir javob bermasliging ham mumkin.</p><div class="response-actions"><button class="action fill" data-choice="yes">Gaplashamiz</button><button class="action outline" data-choice="later">Keyinroq</button><button class="action subtle" data-choice="no">Hozir xohlamayman</button></div><span id="responseStatus" role="status"></span></div>`;
  default:return `<div class="scene-copy finale"><p class="eyebrow">06 / HURMAT BILAN</p><span class="final-sigil">❦</span><h1>${answer==='yes'?'Rahmat,':answer==='no'?'Qaroringni hurmat qilaman.':'Vaqt olishing mumkin.'}</h1><p>${esc(config.final)}</p><span class="written-by">— ${esc(config.sender)}</span><button class="action outline" id="replay">Boshidan ↻</button></div>`;
}}
function renderProposal(){switch(stage){
  case 'intro':return `<div class="scene-copy intro-copy"><p class="eyebrow">01 / BIR UMRGA SAVOL</p><span class="eternal-sigil">◇</span><h1>${esc(config.recipient)}, <em>${esc(config.intro)}</em></h1><p>Birgalikda yaratgan hikoyamizning yana bir bobini ochaylik.</p><button class="action fill" data-next>Boshlash ↗</button></div>`;
  case 'memory':return `<div class="memory-scene"><p class="eyebrow">02 / IKKIMIZNING HIKOYAMIZ</p><h2>${esc(config.memoryTitle)}</h2><p class="memory-date">${dateSentence(config)} — birinchi sahifamiz</p><div class="memory-grid">${mood(config)}</div><button class="action outline" data-next>Bizning film ↗</button></div>`;
  case 'film':return `<div class="film-scene"><p class="eyebrow">03 / BIRGA QADAMLAR</p><h2>Bir umrga <em>sig‘maydigan xotiralar.</em></h2>${film(config)}<button class="action outline" data-next>Senga xat bor ↗</button></div>`;
  case 'letter':return `<div class="letter-scene"><p class="eyebrow">04 / FAQAT SEN UCHUN</p><h2>Bu xat — <em>qalbimdan.</em></h2>${envelope(config)}<button class="action outline" data-next ${letterOpen?'':'disabled'}>Bir savolim bor ↗</button></div>`;
  case 'ring':return `<div class="scene-copy ring-scene"><p class="eyebrow">05 / YANGI BOB</p><div class="jewellery"><button id="ringBox" class="ring-box ${ringOpen?'unboxed':''}" aria-label="Uzuk qutisini ochish" aria-expanded="${ringOpen}"><span class="jewel-halo"></span><span class="jewel">◇</span><span class="box-lid"></span><span class="box-bottom"></span></button></div><h2>${ringOpen?esc(config.final):'Bir savolim bor…'}</h2>${ringOpen?`<div class="response-actions"><button class="action fill" data-choice="yes">Ha, roziman ♡</button><button class="action subtle" data-choice="later">O‘ylab ko‘raman</button><button class="action outline" data-choice="no">Yo‘q, rahmat</button></div>`:'<p>Qutiga bosing.</p>'}<span id="responseStatus" role="status"></span></div>`;
  default:return `<div class="scene-copy finale"><p class="eyebrow">06 / HAMMASI QADRLI</p><span class="final-sigil">♡</span><h1>${answer==='yes'?'Bu lahza bizniki!':answer==='later'?'Qancha kerak bo‘lsa, shuncha vaqt.':'Qaroringni hurmat qilaman.'}</h1><p>${esc(config.letter)}</p><span class="written-by">— ${esc(config.sender)}</span><button class="action outline" id="replay">Boshidan ↻</button></div>`;
}}
function notify(message){const box=$('toast');if(!box)return;box.textContent=message;box.classList.add('visible');setTimeout(()=>box?.classList.remove('visible'),3200);}
function syncSound(){const b=$('sound');if(!b)return;b.textContent=playing&&!bgMusic.paused?'♫ ON':'♫ OFF';b.setAttribute('aria-pressed',String(playing&&!bgMusic.paused));}
async function startMusic(){const src=safeMedia(config.music,'audio');if(!src)return;bgMusic.src=src;bgMusic.volume=.58;try{await bgMusic.play();playing=true;}catch{playing=false;notify('Musiqani yoqish uchun ♫ tugmasini bosing.');}syncSound();}
function navNext(){const scenes=sceneMap[template.type],idx=scenes.indexOf(stage);if(stage==='gift'&&!giftOpen||stage==='letter'&&!letterOpen||stage==='ring'&&!ringOpen)return;if(idx<scenes.length-1)go(scenes[idx+1]);}
function go(next,instant=false){if(lock||!sceneMap[template.type].includes(next))return;const existing=$('stage');if(existing&&next!==stage&&!instant&&!reduce.matches){lock=true;existing.classList.add('departing');setTimeout(()=>{stage=next;lock=false;render();},420);}else{stage=next;render();}}
async function choice(value){if(responseSending)return;answer=value;const output=$('responseStatus');if(published&&/^[a-f0-9]{24}$/.test(published)){responseSending=true;if(output)output.textContent='Javob saqlanmoqda…';try{const r=await fetch('/api/sites/'+published+'/response',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({choice:value})});const j=await r.json();if(!r.ok)throw Error(j.error||'Saqlanmadi');}catch(e){if(output)output.textContent='Javob yuborilmadi: '+e.message;responseSending=false;return;}responseSending=false;}else notify('Preview: javob hech qayerga yuborilmadi.');if(value==='yes')sparkle(38);go('final',true);}
function render(){document.documentElement.dataset.theme=template.type;document.title=`${config.recipient||'Sizga'} uchun · ${template.name} | EMORA`;
  const pages=sceneMap[template.type],i=pages.indexOf(stage),content=template.type==='birthday'?renderBirthday():template.type==='apology'?renderApology():renderProposal();
  $('app').innerHTML=`<div class="cosmos" aria-hidden="true"><i></i><i></i><i></i></div><div class="experience" data-scene="${stage}"><header class="story-head"><a href="/" class="brand" aria-label="EMORA bosh sahifasi">emora<span>✳</span></a><small>${esc(template.eyebrow)}</small><button id="sound" class="icon-btn" aria-pressed="false" aria-label="Musiqani yoqish yoki o‘chirish">♫ OFF</button></header><main class="stage" id="stage" tabindex="-1" aria-label="${esc(template.name)}: ${i+1}-sahna">${content}</main><footer class="story-foot"><button id="back" class="nav-circle" ${i===0?'disabled':''} aria-label="Oldingi sahna">←</button><div class="progress"><span>0${i+1}</span><div class="progress-track"><div style="width:${((i+1)/pages.length)*100}%"></div></div><span>0${pages.length}</span></div><button id="next" class="nav-circle" aria-label="Keyingi sahna" ${i===pages.length-1||stage==='gift'&&!giftOpen||stage==='letter'&&!letterOpen||stage==='ring'&&!ringOpen||['response','ring'].includes(stage)?'disabled':''}>→</button></footer></div><div id="toast" class="toast" role="status"></div>`;
  $('back').onclick=()=>go(pages[Math.max(0,i-1)]);$('next').onclick=navNext;
  document.querySelectorAll('[data-next]').forEach(b=>b.onclick=async()=>{if(stage==='intro'){await startMusic();}navNext();});
  document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choice(b.dataset.choice));
  $('sound').onclick=()=>{if(playing&&!bgMusic.paused){bgMusic.pause();playing=false;syncSound();}else startMusic();};syncSound();
  $('gift')?.addEventListener('click',()=>{giftOpen=true;$('gift').classList.add('opened');$('gift').setAttribute('aria-expanded','true');document.querySelector('.gift-scene>p:not(.eyebrow)').textContent=config.letter||'Senga mingta baxtli lahza tilayman!';document.querySelector('[data-next]').disabled=false;$('next').disabled=false;sparkle(64);});
  $('envelope')?.addEventListener('click',()=>{if(letterOpen)return;letterOpen=true;$('envelope').classList.add('opened');$('envelope').setAttribute('aria-expanded','true');setTimeout(()=>{if($('paper')){$('paper').hidden=false;$('paper').classList.add('revealed');}const next=document.querySelector('[data-next]');if(next)next.disabled=false;if($('next'))$('next').disabled=false;},reduce.matches?0:850);});
  $('ringBox')?.addEventListener('click',()=>{ringOpen=true;$('ringBox').classList.add('unboxed');$('ringBox').setAttribute('aria-expanded','true');setTimeout(()=>{if(stage==='ring'){const prevAnswer=answer;render();answer=prevAnswer;sparkle(70);}},reduce.matches?0:1850);});
  $('replay')?.addEventListener('click',()=>{letterOpen=giftOpen=ringOpen=false;answer='';go('intro');});
  const vid=$('momentVideo');if(vid){vid.onplay=()=>{if(!bgMusic.paused){bgMusic.pause();syncSound();}};vid.onpause=()=>{if(playing)startMusic();};vid.onended=()=>{if(playing)startMusic();};}
  $('stage')?.focus({preventScroll:true});
}
async function load(){const id=chosen;if(published&&/^[a-f0-9]{24}$/.test(published)){try{const r=await fetch('/api/sites/'+published);if(!r.ok)throw Error();const j=await r.json();if(!MOMENTS[j.site?.template])throw Error();config=j.site;template=MOMENTS[config.template];fetch('/api/sites/'+published+'/view',{method:'POST'}).catch(()=>{});}catch{notify('Hikoya topilmadi. Namuna ochildi.');}}render();}
window.addEventListener('message',e=>{if(e.source!==parent||(location.protocol!=='file:'&&e.origin!==location.origin)||e.data?.type!=='emora:moment-preview'||!MOMENTS[e.data.config?.template])return;bgMusic.pause();playing=false;config=e.data.config;template=MOMENTS[config.template];stage='intro';letterOpen=giftOpen=ringOpen=false;render();});
window.addEventListener('pagehide',()=>bgMusic.pause());
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&!(e.target instanceof HTMLInputElement))$('next')?.click();if(e.key==='ArrowLeft')$('back')?.click();});
load();
</script></body></html>
